<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/adadoviz-mark.svg" />
    <link rel="apple-touch-icon" href="/adadoviz-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      display=optional (eskiden swap).

      `swap` yedek fontla çizip Inter gelince DEĞİŞTİRİYOR; her değişim bir
      reflow, yani düzen kayması. Chrome trace'i bunu doğruladı: büro
      ızgarasının 0.21'lik kaymasının kök nedeni olarak bu font gösterildi.

      `optional` ile tarayıcı fontu ancak ~100 ms içinde hazırsa kullanıyor,
      değilse o açılışı yedek fontla tamamlıyor — kayma sıfır. Bedeli: çok
      yavaş ilk ziyarette sistem fontu görünebilir (font önbelleğe alındığı
      için sonraki ziyaretlerde Inter geliyor).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=optional"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ⚠️ HATA DÜZELTMESİ (S-03): Buradaki etiketler JS çalışmadan önce geçerli
      olan yedek meta verisidir. Ancak react-helmet-async, KENDİ oluşturmadığı
      etiketleri kaldırmaz — sayfa açıldığında bunların YANINA kendi
      etiketlerini ekliyordu. Ölçüm (/paketler):

          <title> sayısı     : 2   (ilki BOŞ → tarayıcı onu kullanıyor)
          canonical sayısı   : 2   (ilki ana sayfa → yanlış olan kazanıyor)
          description sayısı : 2

      Yani her alt sayfa arama motoruna kendini ana sayfa olarak bildiriyor,
      /paketler ise hiç başlıksız kalıyordu.

      `data-rh="true"` niteliği helmet-async'e "bu etiketi sen devral" der;
      etiket kopyalanmak yerine yerinde güncellenir. Böylece JS çalıştırmayan
      istemci için yedek meta korunur, çift etiket sorunu ortadan kalkar.
    -->
    <title data-rh="true">AdaDöviz | KKTC Döviz Kurları, Dolar TL, Euro Kur ve Döviz Bürosu</title>
    <!--
      S-03 devamı: `description`, `canonical` ve `og:url` BİLİNÇLİ OLARAK
      buradan kaldırıldı. helmet-async statik etiketleri devralmıyor, yanına
      ekliyordu; tarayıcı ve tarayıcı botları İLK etiketi okuduğu için her alt
      sayfa ana sayfanın açıklamasını ve kanonik adresini gösteriyordu.
      Bunların üçünü de artık SeoHead rota bazında üretir (bkz. SeoHead.jsx).
      Geri kalan etiketler JS çalıştırmayan istemci için yedek olarak duruyor.
    -->
    <meta
      data-rh="true"
      name="keywords"
      content="kktc döviz, dolar tl, döviz bürosu, exchange, kktc exchange, lefkoşa döviz, girne döviz, euro kuru, sterlin kuru, kuzey kıbrıs döviz, adadöviz"
    />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
    <meta data-rh="true" name="geo.region" content="CY" />
    <meta data-rh="true" name="geo.placename" content="Northern Cyprus, KKTC" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="AdaDöviz" />
    <meta
      data-rh="true"
      property="og:title"
      content="AdaDöviz | KKTC Döviz Kurları, Dolar TL, Euro Kur"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="KKTC güncel döviz kurları ve döviz bürosu karşılaştırması. Dolar TL, euro, sterlin."
    />
    <meta data-rh="true" property="og:locale" content="tr_TR" />
    <meta
      data-rh="true"
      property="og:image"
      content="https://adadoviz.tunahangul.com/adadoviz-og.svg"
    />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="AdaDöviz | KKTC Döviz Kurları" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Kuzey Kıbrıs güncel döviz kurları: dolar TL, euro, sterlin."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("finsight-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
          var l = localStorage.getItem("finsight-lang");
          if (l === "en" || l === "tr") document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <!--
    Gövde renkleri Tailwind'in stok slate ölçeğinden (slate-950 = #020617,
    mavi yanı olan bir lacivert) tasarım sistemindeki mat siyah `ink` ölçeğine
    çekildi. Aksi halde React yüklenmeden görülen ilk kare lacivert, sonrası
    siyah oluyordu.
  -->
  <body class="bg-ink-50 text-ink-900 dark:bg-ink-950 dark:text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AdaDöviz">
  <title>AdaDöviz</title>
  <!--
    Simge, paletten kaldırılmış elektrik cyan gradyanını (#22d3ee → #0e7490)
    taşıyordu. Artık mat siyah + beyaz: sekme simgesi de siteyle aynı dili
    konuşuyor. İnce beyaz halka bilinçli — koyu tema kullanan tarayıcılarda
    siyah kare, sekme çubuğunun içinde kaybolur.
  -->
  <rect width="64" height="64" rx="15" fill="#0a0a0c"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 25h22"/>
    <path d="M34.5 19.5 40 25l-5.5 5.5"/>
    <path d="M46 39H24" opacity=".88"/>
    <path d="M29.5 33.5 24 39l5.5 5.5" opacity=".88"/>
  </g>
</svg>
